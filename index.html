<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expense Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-200 min-h-screen flex flex-col justify-between">
<div class="flex-1 p-4 overflow-y-auto">
<h1 class="text-xl font-bold text-blue-700 text-center mb-4">💰 Expense Tracker</h1>
<div class="bg-white p-4 border border-gray-200 shadow-md rounded-lg">
<div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-3 gap-2">
<h2 class="text-lg font-semibold">Expenses</h2>
<div class="flex flex-wrap items-center gap-2">
<span class="text-lg font-semibold">Total: <span id="total" class="text-green-700">Rs. 0</span></span>
<button onclick="saveData()" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700 text-sm">💾 Save</button>
<button onclick="openImportPicker()" class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700 text-sm">📂 Import</button>
<button onclick="openHeaderSettings()" class="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600 text-sm">⚙️</button>
<button onclick="resetHeaders()" class="bg-gray-500 text-white px-3 py-1 rounded hover:bg-gray-600 text-sm">♻️</button>
</div></div>
<ul id="expenseList" class="divide-y divide-gray-200 min-h-[200px]"><li class="text-gray-500 text-center py-8">No expenses added yet. Start by adding your first expense below!</li></ul>
</div></div>

<div class="bg-white p-4 border-t border-gray-300 shadow-lg">
<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
<input id="name" type="text" placeholder="Expense Name" class="px-3 py-2 border border-gray-300 rounded text-sm" maxlength="50" />
<input id="amount" type="number" placeholder="Amount (Rs.)" step="0.01" min="0" class="px-3 py-2 border border-gray-300 rounded text-sm" />
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
<input id="date" type="date" class="px-3 py-2 border border-gray-300 rounded text-sm" />
<input id="category" type="text" placeholder="Category" class="px-3 py-2 border border-gray-300 rounded text-sm" maxlength="30" />
</div>
<input id="quantity" type="text" placeholder="Quantity/Details (optional)" class="w-full px-3 py-2 border border-gray-300 rounded text-sm mb-2" maxlength="50" />
<div class="mb-2 flex items-center gap-2"><input type="checkbox" id="enableMultiply" checked><label for="enableMultiply" class="text-sm text-gray-700">Enable Amount × Quantity</label></div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
<input id="pdfTitle" type="text" placeholder="PDF Title (optional)" class="px-3 py-2 border border-gray-300 rounded text-sm" maxlength="50" />
<button onclick="downloadPDF()" id="pdfBtn" disabled class="bg-red-500 text-white py-2 rounded text-sm font-medium opacity-50 cursor-not-allowed">📄 Download PDF</button>
</div>
<button onclick="addExpense()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-medium">➕ Add / Update Expense</button>
<button onclick="clearAllExpenses()" class="mt-2 w-full bg-gray-500 text-white py-2 rounded hover:bg-gray-600 font-medium">🗑️ Clear All</button>
</div>

<div id="importModal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50 p-4">
<div class="bg-white w-full max-w-md rounded-lg shadow-lg p-5">
<h2 class="text-lg font-semibold mb-3">📂 Import Saved Data</h2>
<input id="fileInput" type="file" accept=".json,application/json" class="hidden" onchange="handleFile(event)" />
<div id="dropZone" class="border-2 border-dashed border-blue-400 rounded-lg p-7 text-center bg-blue-50 cursor-pointer transition">
<div class="text-3xl mb-2">📥</div>
<p class="font-medium text-gray-700">Drag & Drop your JSON file here</p>
<p class="text-sm text-gray-500 mt-1">or</p>
<button type="button" onclick="document.getElementById('fileInput').click()" class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Choose File</button>
<p id="fileName" class="text-xs text-gray-500 mt-3"></p>
</div>
<div id="loadActions" class="hidden mt-4 space-y-2">
<p id="loadInfo" class="text-sm text-gray-600"></p>
<button onclick="confirmLoad('replace')" class="w-full px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Replace Current Data</button>
<button onclick="confirmLoad('add')" class="w-full px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Add To Current Data</button>
</div>
<button onclick="closeImport()" class="w-full mt-3 px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">Cancel</button>
</div></div>

<div id="headerModal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50 p-4"><div class="bg-white w-11/12 sm:w-96 rounded-lg shadow-lg p-5"><h2 class="text-lg font-semibold mb-3">Edit PDF Headers</h2><div id="headerInputs" class="space-y-2"></div><button onclick="closeHeaderSettings()" class="mt-4 w-full px-4 py-2 bg-gray-500 text-white rounded">Close</button></div></div>

<script>
let expenses=[]; let editIndex=null; let pendingImportedData=null;
let pdfHeaders=["S.No","Name","Category","Amount","Qty/Details","Total"];
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().split("T")[0];
function initApp(){ $("date").value=today(); renderExpenses(); }
function saveData(){
 if(!expenses.length){alert("No expenses to save!");return;}
 const payload={app:"Expense Tracker",version:1,exportedAt:new Date().toISOString(),expenses,pdfHeaders};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=`expense_tracker_${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); showToast("Data saved to file successfully!");
}
function openImportPicker(){ $("importModal").classList.remove("hidden"); $("importModal").classList.add("flex"); resetImportUI(); }
function closeImport(){ pendingImportedData=null; $("importModal").classList.add("hidden"); $("importModal").classList.remove("flex"); resetImportUI(); }
function resetImportUI(){ $("fileName").textContent=""; $("loadInfo").textContent=""; $("loadActions").classList.add("hidden"); $("fileInput").value=""; }
function handleFile(event){ const file=event.target.files[0]; if(file) readImportFile(file); }
function readImportFile(file){
 if(!file.name.toLowerCase().endsWith(".json")){alert("Please select a JSON file saved by Expense Tracker.");return;}
 $("fileName").textContent=`Selected: ${file.name}`;
 const reader=new FileReader(); reader.onload=()=>{try{const data=JSON.parse(reader.result); if(!data||!Array.isArray(data.expenses)) throw new Error(); pendingImportedData=data; $("loadInfo").textContent=`${data.expenses.length} expense(s) found. Choose how to load them.`; $("loadActions").classList.remove("hidden");}catch(e){pendingImportedData=null; $("loadActions").classList.add("hidden"); alert("Invalid Expense Tracker JSON file.");}}; reader.readAsText(file);
}
function confirmLoad(mode){
 if(!pendingImportedData)return;
 const imported=pendingImportedData.expenses.map((e,i)=>({id:Date.now()+i+Math.floor(Math.random()*1000),name:String(e.name||"Unnamed Expense"),amount:Number(e.amount)||0,quantity:e.quantity==null?null:String(e.quantity),totalAmount:Number(e.totalAmount??e.amount)||0,date:e.date||today(),category:e.category?String(e.category):null,createdAt:e.createdAt||new Date().toISOString()}));
 expenses=mode==="replace"?imported:expenses.concat(imported);
 if(Array.isArray(pendingImportedData.pdfHeaders)&&pendingImportedData.pdfHeaders.length) pdfHeaders=pendingImportedData.pdfHeaders.map(String);
 closeImport(); editIndex=null; renderExpenses(); showToast(mode==="replace"?"Saved data loaded!":"Saved data added to current expenses!");
}
const dropZone=()=>$("dropZone");
function setupDropZone(){
 const dz=dropZone();
 ["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.add("bg-blue-100","border-blue-600");}));
 ["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.remove("bg-blue-100","border-blue-600");}));
 dz.addEventListener("drop",e=>{const file=e.dataTransfer.files[0];if(file)readImportFile(file);});
 dz.addEventListener("click",e=>{if(e.target.tagName!=="BUTTON")$("fileInput").click();});
}
function renderExpenses(){
 const list=$("expenseList"),total=$("total"),btn=$("pdfBtn");
 if(!expenses.length){list.innerHTML='<li class="text-gray-500 text-center py-8">No expenses added yet. Start by adding your first expense below!</li>';total.textContent="Rs. 0";btn.disabled=true;btn.classList.add("opacity-50","cursor-not-allowed");return;}
 btn.disabled=false;btn.classList.remove("opacity-50","cursor-not-allowed");
 list.innerHTML=expenses.map((e,i)=>{const amt=Number(e.amount||0).toFixed(2),tot=Number(e.totalAmount||0).toFixed(2),qty=e.quantity?` (${escapeHtml(String(e.quantity))})`:"";return `<li class="flex flex-col sm:flex-row justify-between items-start sm:items-center py-3 px-2"><div class="flex-1 min-w-0 mb-2 sm:mb-0"><div class="font-medium">${escapeHtml(String(e.name||""))}</div><div class="text-sm text-gray-600">${escapeHtml(e.category||"No category")} • Rs. ${amt}${qty} • <span class="font-medium">Total: Rs. ${tot}</span></div><div class="text-xs text-gray-500">${formatDate(e.date)}</div></div><div class="flex space-x-2"><button onclick="editExpense(${i})" class="text-blue-500 p-1">✏️</button><button onclick="deleteExpense(${i})" class="text-red-500 p-1">🗑️</button></div></li>`;}).join("");
 total.textContent="Rs. "+expenses.reduce((a,e)=>a+Number(e.totalAmount||0),0).toFixed(2);
}
function addExpense(){const name=$("name"),amount=$("amount"),date=$("date"),cat=$("category"),qty=$("quantity"),mult=$("enableMultiply").checked;if(!name.value.trim()){alert("Please enter an expense name");name.focus();return;}const a=parseFloat(amount.value);if(!a||isNaN(a)||a<=0){alert("Please enter a valid amount greater than 0");amount.focus();return;}if(!date.value){alert("Please select a date");return;}const q=qty.value.trim();const total=(mult&&q&&!isNaN(parseFloat(q)))?a*parseFloat(q):a;const e={id:Date.now(),name:name.value.trim(),amount:a,quantity:q||null,totalAmount:total,date:date.value,category:cat.value.trim()||null,createdAt:new Date().toISOString()};if(editIndex!==null){expenses[editIndex]=e;editIndex=null;showToast("Expense updated successfully!");}else{expenses.push(e);showToast("Expense added successfully!");}name.value="";amount.value="";cat.value="";qty.value="";date.value=today();renderExpenses();}
function editExpense(i){const e=expenses[i];$("name").value=e.name||"";$("amount").value=e.amount||"";$("date").value=e.date||today();$("category").value=e.category||"";$("quantity").value=e.quantity||"";editIndex=i;showToast("Editing mode: Update the fields and press Add / Update Expense");}
function deleteExpense(i){if(confirm("Are you sure you want to delete this expense?")){expenses.splice(i,1);renderExpenses();showToast("Expense deleted successfully!");}}
function clearAllExpenses(){if(!expenses.length){alert("No expenses to clear!");return;}if(confirm(`Are you sure you want to delete all ${expenses.length} expenses? This action cannot be undone.`)){expenses=[];editIndex=null;renderExpenses();showToast("All expenses cleared!");}}
function openHeaderSettings(){const c=$("headerInputs");c.innerHTML="";pdfHeaders.forEach((h,i)=>c.innerHTML+=`<input type="text" value="${escapeHtml(h)}" class="w-full px-3 py-2 border rounded text-sm" oninput="updateHeader(this,${i})"/>`);$("headerModal").classList.remove("hidden");$("headerModal").classList.add("flex");}
function closeHeaderSettings(){$("headerModal").classList.add("hidden");$("headerModal").classList.remove("flex");}
function updateHeader(el,i){pdfHeaders[i]=el.value.trim()||"-";showToast("Header updated. Save the data file to keep this change.");}
function resetHeaders(){if(confirm("Reset headers to default?")){pdfHeaders=["S.No","Name","Category","Amount","Qty/Details","Total"];showToast("Headers reset to default.");}}
function downloadPDF(){if(!expenses.length){alert("No expenses to export!");return;}const {jsPDF}=window.jspdf,doc=new jsPDF("p","pt","a4");const title=$("pdfTitle").value.trim()||"Expense Report";doc.setFontSize(18);doc.setFont("helvetica","bold");doc.text(title,doc.internal.pageSize.width/2,50,{align:"center"});const rows=expenses.map((e,i)=>[i+1,String(e.name||"").length>20?String(e.name).substring(0,20)+"...":e.name,e.category||"-",Number(e.amount||0).toFixed(2),e.quantity||"-",Number(e.totalAmount||0).toFixed(2)]);const sum=expenses.reduce((a,e)=>a+Number(e.totalAmount||0),0);doc.autoTable({head:[pdfHeaders],body:rows,startY:80,styles:{fontSize:10,halign:"center",valign:"middle",cellPadding:5,textColor:[0,0,0],lineColor:[0,0,0],lineWidth:.3},headStyles:{fillColor:false,textColor:[0,0,0],fontStyle:"bold",fontSize:11},foot:[["","","","","TOTAL",sum.toFixed(2)]],footStyles:{fillColor:false,textColor:[0,0,0],fontStyle:"bold",halign:"center"},theme:"grid",margin:{left:40,right:40}});doc.save(`${title.replace(/[^a-z0-9]/gi,"_")}_${today()}.pdf`);showToast("PDF downloaded successfully!");}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");}
function formatDate(d){try{return new Date(d).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});}catch{return d||"";}}
function showToast(msg){const t=document.createElement("div");t.className="fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded shadow-lg z-[100]";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
document.addEventListener("DOMContentLoaded",()=>{["name","amount","date","category","quantity"].forEach(id=>$(id).addEventListener("keypress",e=>{if(e.key==="Enter")addExpense();}));initApp();setupDropZone();});
</script>
</body>
</html>
