<!DOCTYPE html>
<html lang="en" class="">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expense Tracker</title>
<script>
tailwind = { config: { darkMode: 'class' } };
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<style>
html.dark body{background:#111827;color:#f3f4f6}
html.dark .bg-white{background-color:#1f2937!important}
html.dark .bg-gray-50{background-color:#374151!important}
html.dark .bg-gray-200{background-color:#111827!important}
html.dark .border-gray-200,html.dark .border-gray-300{border-color:#4b5563!important}
html.dark .text-gray-700{color:#e5e7eb!important}
html.dark .text-gray-600{color:#d1d5db!important}
html.dark .text-gray-500{color:#9ca3af!important}
html.dark input{background-color:#374151;color:#f9fafb;border-color:#6b7280}
html.dark input::placeholder{color:#9ca3af}
html.dark #headerModal>div,html.dark #importModal>div{background-color:#1f2937}
html.dark #expenseList .border-blue-400{border-color:#60a5fa}
html.dark #emptyDropZone{background:#1f2937!important;border-color:#60a5fa!important;color:#e5e7eb}
html.dark #emptyDropZone:hover{background:#263449!important;border-color:#60a5fa!important}
html.dark #emptyDropZone.drag-over{background:#374151!important;border-color:#60a5fa!important;box-shadow:0 0 0 3px rgba(96,165,250,.22),0 8px 20px rgba(0,0,0,.18);transform:scale(1.01)}
</style>
</head>
<body class="bg-gray-200 min-h-screen flex flex-col justify-between">
<div class="flex-1 p-4 overflow-y-auto">
<h1 class="text-xl font-bold text-blue-700 text-center mb-4">💰 Expense Tracker</h1>
<div class="bg-white p-4 border border-gray-200 shadow-md rounded-lg">
<div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-3 gap-2">
<h2 class="text-lg font-semibold">Expenses</h2>
<div class="flex w-full sm:w-auto flex-nowrap items-center gap-1 whitespace-nowrap overflow-hidden">
<span class="text-xs font-semibold shrink-0 mr-auto">Total: <span id="total" class="text-green-700">Rs. 0</span></span>
<button onclick="saveData()" class="bg-green-600 text-white w-7 h-7 p-0 rounded hover:bg-green-700 text-base leading-none shrink-0 flex items-center justify-center" title="Save" aria-label="Save">💾</button>
<button onclick="openFilePicker()" class="bg-blue-600 text-white w-7 h-7 p-0 rounded hover:bg-blue-700 text-base leading-none shrink-0 flex items-center justify-center" title="Import" aria-label="Import">📂</button>
<button onclick="openHeaderSettings()" class="bg-yellow-500 text-white w-7 h-7 p-0 rounded hover:bg-yellow-600 text-base leading-none shrink-0 flex items-center justify-center" title="Edit PDF header" aria-label="Edit PDF header">✏️</button>
<button onclick="openThemeSettings()" class="bg-purple-600 text-white w-7 h-7 p-0 rounded hover:bg-purple-700 text-base leading-none shrink-0 flex items-center justify-center" title="Theme settings" aria-label="Theme settings">⚙️</button>
</div></div>
<input id="fileInput" type="file" accept=".json,application/json" class="hidden" onchange="handleFile(event)" />
<ul id="expenseList" class="divide-y divide-gray-200 min-h-[200px] max-h-[52vh] overflow-y-auto"></ul>
</div></div>
<div class="bg-white p-4 border-t border-gray-300 shadow-lg">
<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
<input id="name" type="text" placeholder="Expense Name" class="px-3 py-2 border border-gray-300 rounded text-sm" maxlength="50" />
<input id="amount" type="number" placeholder="Amount (Rs.)" step="0.01" min="0" class="px-3 py-2 border border-gray-300 rounded text-sm" />
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
<input id="date" type="date" class="px-3 py-2 border border-gray-300 rounded text-sm" />
<input id="category" type="text" placeholder="Category" class="px-3 py-2 border border-gray-300 rounded text-sm" maxlength="30" />
</div>
<input id="quantity" type="text" placeholder="Quantity/Details (optional)" class="w-full px-3 py-2 border border-gray-300 rounded text-sm mb-2" maxlength="50" />
<div class="mb-2 flex items-center gap-2"><input type="checkbox" id="enableMultiply" checked><label for="enableMultiply" class="text-sm text-gray-700">Enable Amount × Quantity</label></div>
<button onclick="downloadPDF()" id="pdfBtn" disabled class="w-full bg-red-500 text-white py-2 rounded text-sm font-medium opacity-50 cursor-not-allowed" title="Download PDF">📄 Download PDF</button>
<button onclick="addExpense()" class="mt-2 w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-medium" title="Add / Update Expense">➕ Add / Update Expense</button>
<button onclick="clearAllExpenses()" class="mt-2 w-full bg-gray-500 text-white py-2 rounded hover:bg-gray-600 font-medium" title="Clear All">🗑️ Clear All</button>
</div>
<div id="importModal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50 p-4">
<div class="bg-white w-full max-w-md rounded-lg shadow-lg p-5">
<h2 class="text-lg font-semibold mb-3">📂 Import Saved Data</h2>
<p id="loadInfo" class="text-sm text-gray-600 mb-4"></p>
<div class="space-y-2">
<button onclick="confirmLoad('replace')" class="w-full px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Replace Current Data</button>
<button onclick="confirmLoad('add')" class="w-full px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Add To Current Data</button>
</div>
<button onclick="closeImport()" class="w-full mt-3 px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">Cancel</button>
</div></div>
<div id="headerModal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50 p-4">
<div class="bg-white w-11/12 sm:w-96 rounded-lg shadow-lg p-5 max-h-[85vh] overflow-y-auto">
<h2 class="text-lg font-semibold mb-1">Edit PDF Header</h2>
<p class="text-xs text-gray-500 mb-3">Rename headers, turn columns on/off, and control the PDF title. Disabled items are removed from the downloaded PDF.</p>
<div id="headerInputs" class="space-y-2"></div>
<div class="mt-3 p-2 border border-gray-200 rounded bg-gray-50">
<div class="flex items-center gap-2">
<input type="checkbox" id="pdfTitleEnabled" class="w-4 h-4 shrink-0" />
<label for="pdfTitleEnabled" class="text-sm font-medium text-gray-700">Show PDF Title</label>
<span id="pdfTitleStatus" class="text-xs text-gray-500 ml-auto">ON</span>
</div>
<input id="pdfTitle" type="text" placeholder="PDF Title (optional)" class="w-full mt-2 px-3 py-2 border border-gray-300 rounded text-sm" maxlength="50" />
</div>
<div class="flex gap-2 mt-4">
<button onclick="resetHeadersFromModal()" class="flex-1 px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">♻️ Reset to Default</button>
<button onclick="closeHeaderSettings()" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Done</button>
</div>
</div></div>
<div id="themeModal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50 p-4">
<div class="bg-white w-full max-w-sm rounded-lg shadow-lg p-5">
<h2 class="text-lg font-semibold mb-1">Theme</h2>
<p class="text-xs text-gray-500 mb-4">Choose how Expense Tracker should look.</p>
<div class="space-y-2">
<label class="flex items-center gap-3 p-3 border border-gray-200 rounded cursor-pointer bg-gray-50"><input type="radio" name="theme" value="light" class="w-4 h-4" onchange="setTheme('light')"><span class="text-sm font-medium">☀️ Light</span></label>
<label class="flex items-center gap-3 p-3 border border-gray-200 rounded cursor-pointer bg-gray-50"><input type="radio" name="theme" value="dark" class="w-4 h-4" onchange="setTheme('dark')"><span class="text-sm font-medium">🌙 Dark</span></label>
<label class="flex items-center gap-3 p-3 border border-gray-200 rounded cursor-pointer bg-gray-50"><input type="radio" name="theme" value="system" class="w-4 h-4" onchange="setTheme('system')"><span class="text-sm font-medium">💻 System</span></label>
</div>
<button onclick="closeThemeSettings()" class="w-full mt-4 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Done</button>
</div></div>
<script>
let expenses=[];let editIndex=null;let pendingImportedData=null;
const DEFAULT_PDF_HEADERS=["S.No","Name","Category","Amount","Qty/Details","Total"];
let pdfHeaders=[...DEFAULT_PDF_HEADERS];
let pdfHeaderEnabled=DEFAULT_PDF_HEADERS.map(()=>true);
let pdfTitleEnabled=true;
const $=id=>document.getElementById(id);const today=()=>new Date().toISOString().split("T")[0];
function applyTheme(theme){const root=document.documentElement;const effective=theme==="system"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):theme;root.classList.toggle("dark",effective==="dark");}
function getTheme(){return localStorage.getItem("expenseTrackerTheme")||"system";}
function setTheme(theme){localStorage.setItem("expenseTrackerTheme",theme);applyTheme(theme);updateThemeRadio();showToast(`${theme.charAt(0).toUpperCase()+theme.slice(1)} theme selected.`);}
function updateThemeRadio(){const theme=getTheme();document.querySelectorAll('input[name="theme"]').forEach(r=>r.checked=r.value===theme);}
function openThemeSettings(){updateThemeRadio();$("themeModal").classList.remove("hidden");$("themeModal").classList.add("flex");}
function closeThemeSettings(){$("themeModal").classList.add("hidden");$("themeModal").classList.remove("flex");}
function initTheme(){applyTheme(getTheme());if(window.matchMedia){window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(getTheme()==="system")applyTheme("system");});}}
function initApp(){initTheme();$("date").value=today();renderExpenses();setupDropZone();}
function normalizeHeaderSettings(headers,enabled,titleEnabled){const safeHeaders=Array.isArray(headers)&&headers.length?headers.map(String):[...DEFAULT_PDF_HEADERS];const safeEnabled=Array.isArray(enabled)?safeHeaders.map((_,i)=>enabled[i]!==false):safeHeaders.map(()=>true);pdfHeaders=safeHeaders;pdfHeaderEnabled=safeEnabled;pdfTitleEnabled=titleEnabled!==false;}
function saveData(){if(!expenses.length){alert("No expenses to save!");return;}const payload={app:"Expense Tracker",version:3,exportedAt:new Date().toISOString(),expenses,pdfHeaders,pdfHeaderEnabled,pdfTitleEnabled,pdfTitle:$("pdfTitle").value.trim()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`expense_tracker_${today()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showToast("Data saved to file successfully!");}
function openFilePicker(){$("fileInput").click();}function handleFile(event){const file=event.target.files[0];if(file)readImportFile(file);event.target.value="";}
function readImportFile(file){if(!file.name.toLowerCase().endsWith(".json")){alert("Please select a JSON file saved by Expense Tracker.");return;}const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||!Array.isArray(data.expenses))throw new Error();pendingImportedData=data;$("loadInfo").textContent=`${data.expenses.length} expense(s) found in ${file.name}. Choose how to load them.`;$("importModal").classList.remove("hidden");$("importModal").classList.add("flex");}catch(e){pendingImportedData=null;alert("Invalid Expense Tracker JSON file.");}};reader.readAsText(file);}
function closeImport(){pendingImportedData=null;$("importModal").classList.add("hidden");$("importModal").classList.remove("flex");$("loadInfo").textContent="";}
function confirmLoad(mode){if(!pendingImportedData)return;const imported=pendingImportedData.expenses.map((e,i)=>({id:Date.now()+i+Math.floor(Math.random()*1000),name:String(e.name||"Unnamed Expense"),amount:Number(e.amount)||0,quantity:e.quantity==null?null:String(e.quantity),totalAmount:Number(e.totalAmount??e.amount)||0,date:e.date||today(),category:e.category?String(e.category):null,createdAt:e.createdAt||new Date().toISOString()}));expenses=mode==="replace"?imported:expenses.concat(imported);if(Array.isArray(pendingImportedData.pdfHeaders)&&pendingImportedData.pdfHeaders.length){normalizeHeaderSettings(pendingImportedData.pdfHeaders,pendingImportedData.pdfHeaderEnabled,pendingImportedData.pdfTitleEnabled);if(typeof pendingImportedData.pdfTitle==="string")$("pdfTitle").value=pendingImportedData.pdfTitle;}closeImport();editIndex=null;renderExpenses();showToast(mode==="replace"?"Saved data loaded!":"Saved data added to current expenses!");}
function setupDropZone(){const dz=$("expenseList");["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{if(!e.dataTransfer.types.includes("Files"))return;e.preventDefault();e.stopPropagation();if(expenses.length===0)$("emptyDropZone")?.classList.add("bg-blue-100","border-blue-600","drag-over");}));["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();$("emptyDropZone")?.classList.remove("bg-blue-100","border-blue-600","drag-over");}));dz.addEventListener("drop",e=>{if(expenses.length>0)return;const file=e.dataTransfer.files[0];if(file)readImportFile(file);});}
function renderExpenses(){const list=$("expenseList"),total=$("total"),btn=$("pdfBtn");if(!expenses.length){list.classList.add("flex","items-center","justify-center");list.innerHTML=`<li id="emptyDropZone" class="border-2 border-dashed border-blue-400 rounded-lg w-full max-w-md p-3 text-center bg-blue-50 transition flex flex-col items-center justify-center"><div class="text-2xl mb-1">📥</div><p class="font-medium text-sm text-gray-700 text-center">Drag & Drop your JSON file here</p></li>`;total.textContent="Rs. 0";btn.disabled=true;btn.classList.add("opacity-50","cursor-not-allowed");return;}list.classList.remove("flex","items-center","justify-center");btn.disabled=false;btn.classList.remove("opacity-50","cursor-not-allowed");list.innerHTML=expenses.map((e,i)=>{const amt=Number(e.amount||0).toFixed(2),tot=Number(e.totalAmount||0).toFixed(2),qty=e.quantity?` (${escapeHtml(String(e.quantity))})`:"";return `<li class="flex flex-col sm:flex-row justify-between items-start sm:items-center py-3 px-2"><div class="flex-1 min-w-0 mb-2 sm:mb-0"><div class="font-medium">${escapeHtml(String(e.name||""))}</div><div class="text-sm text-gray-600">${escapeHtml(e.category||"No category")} • Rs. ${amt}${qty} • <span class="font-medium">Total: Rs. ${tot}</span></div><div class="text-xs text-gray-500">${formatDate(e.date)}</div></div><div class="flex space-x-2"><button onclick="moveExpense(${i},-1)" class="text-gray-500 hover:text-blue-500 p-1" title="Move up" ${i===0?"disabled":""}>⬆️</button><button onclick="moveExpense(${i},1)" class="text-gray-500 hover:text-blue-500 p-1" title="Move down" ${i===expenses.length-1?"disabled":""}>⬇️</button><button onclick="editExpense(${i})" class="text-blue-500 p-1" title="Edit">✏️</button><button onclick="deleteExpense(${i})" class="text-red-500 p-1" title="Delete">🗑️</button></div></li>`;}).join("");total.textContent="Rs. "+expenses.reduce((a,e)=>a+Number(e.totalAmount||0),0).toFixed(2);}
function moveExpense(i,direction){const ni=i+direction;if(ni<0||ni>=expenses.length)return;[expenses[i],expenses[ni]]=[expenses[ni],expenses[i]];renderExpenses();showToast(direction<0?"Expense moved up.":"Expense moved down.");}
function addExpense(){const name=$("name"),amount=$("amount"),date=$("date"),cat=$("category"),qty=$("quantity"),mult=$("enableMultiply").checked;if(!name.value.trim()){alert("Please enter an expense name");name.focus();return;}const a=parseFloat(amount.value);if(!a||isNaN(a)||a<=0){alert("Please enter a valid amount greater than 0");amount.focus();return;}if(!date.value){alert("Please select a date");return;}const q=qty.value.trim();const total=(mult&&q&&!isNaN(parseFloat(q)))?a*parseFloat(q):a;const e={id:Date.now(),name:name.value.trim(),amount:a,quantity:q||null,totalAmount:total,date:date.value,category:cat.value.trim()||null,createdAt:new Date().toISOString()};if(editIndex!==null){expenses[editIndex]=e;editIndex=null;showToast("Expense updated successfully!");}else{expenses.push(e);showToast("Expense added successfully!");}name.value="";amount.value="";cat.value="";qty.value="";date.value=today();renderExpenses();}
function editExpense(i){const e=expenses[i];$("name").value=e.name||"";$("amount").value=e.amount||"";$("date").value=e.date||today();$("category").value=e.category||"";$("quantity").value=e.quantity||"";editIndex=i;showToast("Editing mode: Update the fields and press Add / Update Expense");}
function deleteExpense(i){if(confirm("Are you sure you want to delete this expense?")){expenses.splice(i,1);renderExpenses();showToast("Expense deleted successfully!");}}
function clearAllExpenses(){if(!expenses.length){alert("No expenses to clear!");return;}if(confirm(`Are you sure you want to delete all ${expenses.length} expenses? This action cannot be undone.`)){expenses=[];editIndex=null;renderExpenses();showToast("All expenses cleared!");}}
function openHeaderSettings(){renderHeaderInputs();$("headerModal").classList.remove("hidden");$("headerModal").classList.add("flex");}
function renderHeaderInputs(){const c=$("headerInputs");c.innerHTML="";pdfHeaders.forEach((h,i)=>{const row=document.createElement("div");row.className="flex items-center gap-2 p-2 border border-gray-200 rounded bg-gray-50";const checkbox=document.createElement("input");checkbox.type="checkbox";checkbox.checked=pdfHeaderEnabled[i]!==false;checkbox.className="w-4 h-4 shrink-0";checkbox.title=`Show ${h} in PDF`;const input=document.createElement("input");input.type="text";input.value=h;input.className="flex-1 min-w-0 px-3 py-2 border rounded text-sm bg-white";input.oninput=()=>{pdfHeaders[i]=input.value.trim()||"-";};const label=document.createElement("span");label.className="text-xs text-gray-500 w-10 text-center";label.textContent=checkbox.checked?"ON":"OFF";checkbox.onchange=()=>{pdfHeaderEnabled[i]=checkbox.checked;label.textContent=checkbox.checked?"ON":"OFF";showToast(checkbox.checked?`${pdfHeaders[i]} header enabled.`:`${pdfHeaders[i]} header turned off.`);};row.appendChild(checkbox);row.appendChild(input);row.appendChild(label);c.appendChild(row);});const titleEnabled=$("pdfTitleEnabled");titleEnabled.checked=pdfTitleEnabled;$("pdfTitleStatus").textContent=titleEnabled.checked?"ON":"OFF";$("pdfTitle").value=$("pdfTitle").value||"";titleEnabled.onchange=()=>{pdfTitleEnabled=titleEnabled.checked;$("pdfTitleStatus").textContent=pdfTitleEnabled?"ON":"OFF";showToast(pdfTitleEnabled?"PDF title enabled.":"PDF title turned off.");};$("pdfTitle").oninput=()=>{};}
function closeHeaderSettings(){$("headerModal").classList.add("hidden");$("headerModal").classList.remove("flex");}
function resetHeadersFromModal(){if(confirm("Reset PDF headers and title settings to default?")){resetHeadersToDefault();renderHeaderInputs();showToast("PDF header settings reset to default.");}}
function resetHeadersToDefault(){pdfHeaders=[...DEFAULT_PDF_HEADERS];pdfHeaderEnabled=DEFAULT_PDF_HEADERS.map(()=>true);pdfTitleEnabled=true;$("pdfTitle").value="";}
function downloadPDF(){if(!expenses.length){alert("No expenses to export!");return;}const enabledIndices=pdfHeaders.map((_,i)=>i).filter(i=>pdfHeaderEnabled[i]!==false);if(!enabledIndices.length){alert("Please enable at least one PDF header before downloading.");return;}const {jsPDF}=window.jspdf,doc=new jsPDF("p","pt","a4");const title=$("pdfTitle").value.trim()||"Expense Report";const showTitle=pdfTitleEnabled!==false;let startY=40;if(showTitle){doc.setFontSize(18);doc.setFont("helvetica","bold");doc.text(title,doc.internal.pageSize.width/2,50,{align:"center"});startY=80;}const rows=expenses.map((e,i)=>{const fullRow=[i+1,String(e.name||"").length>20?String(e.name).substring(0,20)+"...":e.name,e.category||"-",Number(e.amount||0).toFixed(2),e.quantity||"-",Number(e.totalAmount||0).toFixed(2)];return enabledIndices.map(index=>fullRow[index]);});const sum=expenses.reduce((a,e)=>a+Number(e.totalAmount||0),0);const footer=new Array(enabledIndices.length).fill("");if(enabledIndices.length===1){footer[0]=sum.toFixed(2);}else{footer[enabledIndices.length-2]="TOTAL";footer[enabledIndices.length-1]=sum.toFixed(2);}doc.autoTable({head:[enabledIndices.map(i=>pdfHeaders[i])],body:rows,startY,styles:{fontSize:10,halign:"center",valign:"middle",cellPadding:5,textColor:[0,0,0],lineColor:[0,0,0],lineWidth:.3},headStyles:{fillColor:false,textColor:[0,0,0],fontStyle:"bold",fontSize:11},foot:[footer],footStyles:{fillColor:false,textColor:[0,0,0],fontStyle:"bold",halign:"center"},theme:"grid",margin:{left:40,right:40}});doc.save(`${(showTitle?title:"Expense Report").replace(/[^a-z0-9]/gi,"_")}_${today()}.pdf`);showToast("PDF downloaded successfully!");}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");}function formatDate(d){try{return new Date(d+"T00:00:00").toLocaleDateString("en-IN");}catch{return d||"-";}}function showToast(msg){let t=$("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="fixed bottom-4 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-lg shadow-lg text-sm z-[60]";document.body.appendChild(t);}t.textContent=msg;t.classList.remove("hidden");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add("hidden"),2200);}
initApp();
</script>
</body>
</html>
